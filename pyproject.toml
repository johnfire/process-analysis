[project]
name = "process-analysis"
version = "0.1.0"
description = "AI-native process refactoring: finding the steps that shouldn't exist"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# corpus/ and schema/ are data and prompts, not importable packages; say so explicitly or
# setuptools refuses the flat layout.
[tool.setuptools]
packages = ["analyzer"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-jsonschema",
    "pip-audit>=2.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "PLW"]
# Transcripts use typographic punctuation on purpose; matching it is the point.
ignore = ["RUF001"]

[tool.mypy]
python_version = "3.11"
files = ["analyzer"]
