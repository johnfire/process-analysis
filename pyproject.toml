[project]
name = "process-analysis"
version = "0.1.0"
description = "AI-native process refactoring: finding the steps that shouldn't exist"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# corpus/ and schema/ are data and prompts, not importable packages; say so explicitly or
# setuptools refuses the flat layout.
[tool.setuptools]
packages = ["analyzer", "web", "worker"]

[tool.setuptools.package-data]
web = ["templates/*.html", "static/*", "static/fonts/*"]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1.4",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "python-multipart>=0.0.12",
    "segno>=1.6",
]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "jsonschema>=4.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-jsonschema",
    "pip-audit>=2.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "PLW"]
# Transcripts use typographic punctuation on purpose; matching it is the point.
ignore = ["RUF001"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts these calls in parameter defaults on purpose.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form"]

[tool.mypy]
python_version = "3.11"
files = ["analyzer", "web", "worker"]
