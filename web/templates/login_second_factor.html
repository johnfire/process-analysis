{% extends "base.html" %}
{% block title %}Second step · Process Analysis{% endblock %}
{% block content %}
<section class="panel">
  <h1 class="page-title">Second step</h1>
  <p>Enter the 6-digit code from your authenticator app, or one of your recovery codes.</p>
  {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login/2fa" class="auth-form">
    <label for="code">Code</label>
    <input id="code" name="code" type="text" inputmode="text" autocomplete="one-time-code"
           autocapitalize="off" spellcheck="false" required autofocus>
    <div class="form-actions"><button type="submit" class="button">Continue</button></div>
  </form>
</section>
{% endblock %}
