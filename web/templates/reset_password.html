{% extends "base.html" %}
{% block title %}Choose a new password · Process Analysis{% endblock %}
{% block content %}
<section class="panel">
  <h1 class="page-title">Choose a new password</h1>
  {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/reset/{{ token }}" class="auth-form">
    {% set password_field = 'password' %}
    {% include "partials/new_password_fields.html" %}
    <div class="form-actions"><button type="submit" class="button">Change password</button></div>
  </form>
</section>
{% endblock %}
