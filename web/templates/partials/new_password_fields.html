<label for="new-password">New password</label>
<div class="password-field">
  <input id="new-password" name="{{ password_field }}" type="password" autocomplete="new-password"
         minlength="12" required aria-describedby="password-hint">
  <button type="button" class="link-button" data-toggle-password aria-pressed="false">Show</button>
</div>
<p id="password-hint" class="hint">At least 12 characters. A passphrase of several words works well.</p>

<label for="confirmation">Repeat the password</label>
<input id="confirmation" name="confirmation" type="password" autocomplete="new-password" minlength="12" required>
