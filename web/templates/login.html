{% extends "base.html" %}
{% block title %}Log in · Process Analysis{% endblock %}
{% block content %}
<section class="panel">
  <h1 class="page-title">Log in</h1>
  {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="auth-form">
    {% include "partials/login_fields.html" %}
    <div class="form-actions"><button type="submit" class="button">Log in</button></div>
  </form>
</section>
{% endblock %}
