# /etc/apache2/sites-available/process-analysis.conf
# Plain-HTTP vhost. `certbot --apache -d process-analysis.christopherrehm.de` derives the
# -le-ssl.conf HTTPS vhost from it and adds the redirect.
<VirtualHost 82.165.32.162:80>
    ServerName process-analysis.christopherrehm.de

    # Let Apache serve ACME challenges from disk; proxy everything else.
    ProxyPass /.well-known/acme-challenge/ !
    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory "/var/www/html/.well-known/acme-challenge/">
        Require all granted
    </Directory>

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    ProxyPass / http://127.0.0.1:8110/
    ProxyPassReverse / http://127.0.0.1:8110/
    ErrorLog ${APACHE_LOG_DIR}/process-analysis-error.log
    CustomLog ${APACHE_LOG_DIR}/process-analysis-access.log combined
</VirtualHost>
